<title>運営ツール</title>
<style>
  :root {
    --bg: #faf8f5;
    --surface: #ffffff;
    --surface-2: #f2ede5;
    --border: #e4dfd6;
    --text: #2b2622;
    --muted: #79706a;
    --accent: #c2622b;
    --accent-ink: #ffffff;
    --danger: #b3362c;
    --danger-ink: #ffffff;
    --success: #3e7a4c;
    --success-ink: #ffffff;
    --focus: #c2622b;
    --shadow: 0 1px 2px rgba(43, 38, 34, 0.06), 0 8px 24px -12px rgba(43, 38, 34, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1915;
      --surface: #262220;
      --surface-2: #2f2a26;
      --border: #3a332c;
      --text: #f2ede6;
      --muted: #a89c8f;
      --accent: #e08a4f;
      --accent-ink: #1c1915;
      --danger: #e2746a;
      --danger-ink: #1c1915;
      --success: #5fae72;
      --success-ink: #1c1915;
      --focus: #e08a4f;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1915;
    --surface: #262220;
    --surface-2: #2f2a26;
    --border: #3a332c;
    --text: #f2ede6;
    --muted: #a89c8f;
    --accent: #e08a4f;
    --accent-ink: #1c1915;
    --danger: #e2746a;
    --danger-ink: #1c1915;
    --success: #5fae72;
    --success-ink: #1c1915;
    --focus: #e08a4f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding-inline: 16px;
    padding-block: 28px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  button.link {
    background: none; border: none; color: var(--accent); font: inherit; font-weight: 600;
    cursor: pointer; padding: 4px 0; text-decoration: none;
  }
  button.link:hover { text-decoration: underline; }
  button.link:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab {
    font: inherit; font-weight: 700; background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 8px 14px; cursor: pointer;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .count {
    display: inline-block; margin-left: 6px; font-size: 11px; padding: 1px 6px; border-radius: 999px;
    background: var(--surface-2); color: var(--muted);
  }
  .tab.active .count { background: color-mix(in srgb, var(--accent) 16%, var(--surface-2)); color: var(--accent); }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); padding: 20px;
  }

  label.field { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  input[type="password"], textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
  }
  input[type="password"]:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 1px;
  }
  textarea { resize: vertical; min-height: 72px; }

  button.primary, button.danger, button.ghost {
    font: inherit; font-weight: 700; border-radius: 8px; padding: 10px 18px; cursor: pointer; border: 1px solid transparent;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  button.primary:disabled, button.danger:disabled { opacity: 0.5; cursor: default; }
  button.danger { background: var(--danger); color: var(--danger-ink); }
  button.ghost { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

  .error-banner {
    background: color-mix(in srgb, var(--danger) 14%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--danger) 40%, var(--border));
    color: var(--text); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-top: 14px;
  }
  .notice-banner {
    background: color-mix(in srgb, var(--success) 14%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--success) 40%, var(--border));
    color: var(--text); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-top: 14px;
  }

  .deal-list { display: flex; flex-direction: column; gap: 10px; }
  .deal-row {
    display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; cursor: pointer; font: inherit; color: var(--text);
    border-left: 4px solid var(--accent);
  }
  .deal-row:hover { background: var(--surface-2); }
  .deal-row .price { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 74px; }
  .deal-row .meta { flex: 1; min-width: 0; }
  .deal-row .origin { font-size: 13px; color: var(--muted); }
  .deal-row .expires { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
  }
  .pill.warn { background: color-mix(in srgb, var(--danger) 16%, var(--surface-2)); color: var(--danger); }
  .pill.todo { background: color-mix(in srgb, var(--accent) 16%, var(--surface-2)); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .pill.ok { background: color-mix(in srgb, var(--success) 16%, var(--surface-2)); color: var(--success); }
  .deal-row.done { border-left-color: var(--border); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }

  .detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  .detail-head h2 { font-size: 17px; margin: 0 0 4px; }
  .parties { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .parties b { color: var(--text); }

  .report-box {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 16px;
    font-size: 13.5px;
  }
  .report-box .reason { font-weight: 700; }

  .messages {
    display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 16px;
  }
  .msg { max-width: 80%; padding: 7px 11px; border-radius: 12px; font-size: 13.5px; }
  .msg .meta { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .msg.buyer { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .msg.seller { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 3px; }
  .msg.seller .meta { color: color-mix(in srgb, var(--accent-ink) 70%, transparent); }

  .divider { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: var(--muted); font-size: 12px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  nav.main-nav { display: flex; gap: 8px; margin-bottom: 16px; }
  nav.main-nav button {
    font: inherit; font-weight: 600; font-size: 13px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer;
  }
  nav.main-nav button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .uni-list { display: flex; flex-direction: column; gap: 10px; }
  .uni-row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .uni-row-head { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .uni-row-head .name { font-weight: 600; flex: 1; min-width: 0; }
  .uni-row-head .meta { font-size: 12px; color: var(--muted); }
  .wish-emails { margin-top: 16px; display: grid; gap: 8px; }
  .wish-emails ul { margin: 0; padding-left: 18px; font-variant-numeric: tabular-nums; user-select: text; }
  .wish-emails button { justify-self: start; }
  .uni-row-head .wish { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); min-width: 48px; text-align: right; }
  .uni-edit { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .uni-edit input[type="text"] {
    width: 100%; font: inherit; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
  }
  .stat-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .stat-tile { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .stat-tile .label { font-size: 12px; color: var(--muted); }
  .stat-tile .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-section { margin-bottom: 22px; }
  .stat-section h3 { font-size: 14px; margin: 0 0 8px; }
  .stat-row { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr) 7.5em; gap: 10px; align-items: center; padding: 4px 0; font-size: 13px; }
  .stat-row .label { overflow-wrap: anywhere; }
  .stat-row .bar { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
  .stat-row .bar span { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
  .stat-row .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat-row .num small { color: var(--muted); margin-left: 4px; }
  .stat-note { font-size: 12px; color: var(--muted); margin: 0 0 16px; }
  @media (max-width: 520px) {
    .stat-row { grid-template-columns: minmax(0, 1fr) 7.5em; }
    .stat-row .bar { grid-column: 1 / -1; order: 3; }
  }

  label.checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 10px; cursor: pointer; }

  [hidden] { display: none !important; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid currentColor; border-top-color: transparent; animation: spin 0.7s linear infinite; vertical-align: -2px;
  }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.6s; } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="pageTitle">審査キュー</h1>
      <div class="sub" id="pageSub">審査中(disputed)の取引 — 完了・取消の判断</div>
    </div>
    <button class="link" id="changeSecretBtn" hidden>シークレットを変更</button>
  </header>

  <nav class="main-nav" id="mainNav" hidden>
    <button id="navReview" class="active">審査キュー</button>
    <button id="navUniversities">大学の要望</button>
    <button id="navStats">統計</button>
  </nav>

  <!-- 1. シークレット入力 / Googleログイン -->
  <section id="screen-secret" class="card">
    <div id="googleButton"></div>
    <div class="divider"><span>または</span></div>
    <label class="field" for="secretInput">ADMIN_SECRET</label>
    <input type="password" id="secretInput" autocomplete="off" spellcheck="false" placeholder="貼り付けてください" />
    <div class="btn-row">
      <button class="primary" id="secretSubmit">保存して一覧へ</button>
    </div>
    <div id="secretError" class="error-banner" hidden></div>
    <p class="sub" style="margin-top:14px;">このブラウザだけに保存されます(sessionStorage)。タブを閉じると消えます。</p>
  </section>

  <!-- 2. 一覧(タブ切り替え) -->
  <section id="screen-list" class="card" hidden>
    <div class="tabs">
      <button class="tab active" id="tabReviews" data-tab="reviews">審査中の取引<span class="count" id="countReviews"></span></button>
      <button class="tab" id="tabReports" data-tab="reports">取引後の問題報告<span class="count" id="countReports"></span></button>
      <button class="tab" id="tabCancels" data-tab="cancels">キャンセル<span class="count" id="countCancels"></span></button>
    </div>

    <div id="listLoading" class="empty"><span class="spinner"></span> 読み込み中…</div>
    <div id="listError" class="error-banner" hidden></div>
    <div id="listEmpty" class="empty" hidden></div>
    <div id="dealList" class="deal-list"></div>
    <div class="btn-row">
      <button class="ghost" id="listRetry" hidden>再試行</button>
      <button class="ghost" id="listRefresh">更新</button>
    </div>
  </section>

  <!-- 3a. 審査中の取引の詳細 -->
  <section id="screen-detail" class="card" hidden>
    <button class="link" id="backToList">← 一覧へ戻る</button>
    <div id="detailLoading" class="empty" style="margin-top:14px;"><span class="spinner"></span> 読み込み中…</div>
    <div id="detailError" class="error-banner" hidden></div>
    <div id="detailBody" hidden>
      <div class="detail-head">
        <div>
          <h2 id="detailTitle"></h2>
          <div class="sub" id="detailPrice"></div>
        </div>
        <span class="pill" id="detailOrigin"></span>
      </div>
      <div class="parties">
        <div>購入者: <b id="detailBuyer"></b></div>
        <div>出品者: <b id="detailSeller"></b></div>
      </div>
      <div class="messages" id="detailMessages"></div>
      <label class="field" for="noteInput">判断の理由(必須・記録されます)</label>
      <textarea id="noteInput" placeholder="例: チャットで受け渡しの合意を確認した"></textarea>
      <div id="actionError" class="error-banner" hidden></div>
      <div class="btn-row">
        <button class="primary" id="completeBtn">完了にする</button>
        <button class="danger" id="cancelBtn">取消にする</button>
      </div>
    </div>
  </section>

  <!-- 3c. キャンセルの申請の詳細(審査待ちなら、承認・却下) -->
  <section id="screen-cancel-detail" class="card" hidden>
    <button class="link" id="backToListFromCancel">← 一覧へ戻る</button>
    <div id="cancelDetailLoading" class="empty" style="margin-top:14px;"><span class="spinner"></span> 読み込み中…</div>
    <div id="cancelDetailError" class="error-banner" hidden></div>
    <div id="cancelDetailBody" hidden>
      <div class="detail-head">
        <div>
          <h2 id="cancelDetailTitle"></h2>
          <div class="sub" id="cancelDetailPrice"></div>
        </div>
        <span class="pill" id="cancelDetailBy"></span>
      </div>
      <div class="parties">
        <div>購入者: <b id="cancelDetailBuyer"></b></div>
        <div>出品者: <b id="cancelDetailSeller"></b></div>
      </div>
      <div class="report-box">
        <div class="reason" id="cancelReason"></div>
        <div id="cancelDetailText" style="white-space:pre-wrap;"></div>
        <div class="sub" id="cancelCreatedAt" style="margin-top:6px;"></div>
        <div class="sub" id="cancelHistory"></div>
        <div class="sub" id="cancelDecidedAt"></div>
      </div>
      <div class="messages" id="cancelMessages"></div>
      <div id="cancelDecision" hidden>
        <label class="field" for="cancelNoteInput">判断の理由(必須・記録されます)</label>
        <textarea id="cancelNoteInput" placeholder="例: チャットで、3日間返信がないことを確認した"></textarea>
        <p class="sub" style="margin:10px 0 0;">承認すると、取引がキャンセルされ、双方に通知され、与信が解放されます。却下は、申請した人にだけ通知され、取引はそのまま続きます。</p>
        <div id="cancelActionError" class="error-banner" hidden></div>
        <div class="btn-row">
          <button class="danger" id="approveCancelBtn">承認する(取引をキャンセル)</button>
          <button class="ghost" id="rejectCancelBtn">却下する(取引は続く)</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 3b. 事後問題報告の詳細 -->
  <section id="screen-report-detail" class="card" hidden>
    <button class="link" id="backToListFromReport">← 一覧へ戻る</button>
    <div id="reportDetailLoading" class="empty" style="margin-top:14px;"><span class="spinner"></span> 読み込み中…</div>
    <div id="reportDetailError" class="error-banner" hidden></div>
    <div id="reportDetailBody" hidden>
      <div class="detail-head">
        <div>
          <h2 id="reportDetailTitle"></h2>
          <div class="sub" id="reportDetailPrice"></div>
        </div>
        <span class="pill" id="reportDetailWindow"></span>
      </div>
      <div class="parties">
        <div>購入者: <b id="reportDetailBuyer"></b></div>
        <div>出品者: <b id="reportDetailSeller"></b></div>
      </div>
      <div class="report-box">
        <div class="reason" id="reportReason"></div>
        <div id="reportDetail"></div>
        <div class="sub" id="reportCreatedAt" style="margin-top:6px;"></div>
      </div>
      <div class="messages" id="reportMessages"></div>
      <label class="field" for="reportNoteInput">判断の理由(返金の場合のみ必須・記録されます)</label>
      <textarea id="reportNoteInput" placeholder="例: 偽物であることをメッセージと写真で確認した"></textarea>
      <div id="reportActionError" class="error-banner" hidden></div>
      <div class="btn-row">
        <button class="danger" id="refundBtn">返金する(手数料を除いた額)</button>
        <button class="ghost" id="dismissBtn">問題なしとして却下</button>
      </div>
    </div>
  </section>

  <!-- 4. 大学の要望 -->
  <section id="screen-uni" class="card" hidden>
    <div id="uniLoading" class="empty"><span class="spinner"></span> 読み込み中…</div>
    <div id="uniError" class="error-banner" hidden></div>
    <div id="uniEmpty" class="empty" hidden>大学のデータがありません。</div>
    <div id="uniList" class="uni-list"></div>
    <div class="btn-row">
      <button class="ghost" id="uniRetry" hidden>再試行</button>
      <button class="ghost" id="uniRefresh">更新</button>
    </div>
  </section>

  <!-- 5. 統計 -->
  <section id="screen-stats" class="card" hidden>
    <div id="statsLoading" class="empty"><span class="spinner"></span> 読み込み中…</div>
    <div id="statsError" class="error-banner" hidden></div>
    <p class="stat-note" id="statsNote" hidden></p>
    <div id="statsBody"></div>
    <div class="btn-row">
      <button class="ghost" id="statsRefresh">更新</button>
      <button class="ghost" id="statsCopy">表をコピー（TSV）</button>
    </div>
  </section>
</div>

    cancelActionError: document.getElementById('cancelActionError'),
    approveCancelBtn: document.getElementById('approveCancelBtn'),
    rejectCancelBtn: document.getElementById('rejectCancelBtn'),
  };

  function getCred() { try { return JSON.parse(sessionStorage.getItem(SS_KEY) || 'null'); } catch (e) { return null; } }
  function setCred(type, value) { try { sessionStorage.setItem(SS_KEY, JSON.stringify({ type: type, value: value })); } catch (e) {} }
  function clearCred() { try { sessionStorage.removeItem(SS_KEY); } catch (e) {} }
  var clearSecret = clearCred;

  function authHeaders() {
    var cred = getCred();
    if (!cred) return {};
    if (cred.type === 'google') return { authorization: 'Bearer ' + cred.value };
    return { 'x-admin-secret': cred.value };
  }

  function show(screen) {
    el.screenSecret.hidden = screen !== 'secret';
    el.screenList.hidden = screen !== 'list';
    el.screenDetail.hidden = screen !== 'detail';
    el.screenReportDetail.hidden = screen !== 'report-detail';
    el.screenCancelDetail.hidden = screen !== 'cancel-detail';
    el.changeSecretBtn.hidden = screen === 'secret';
    el.screenUni.hidden = screen !== 'uni';
    el.mainNav.hidden = screen === 'secret';
    el.screenStats.hidden = screen !== 'stats';
    el.navUniversities.classList.toggle('active', screen === 'uni');
    el.navStats.classList.toggle('active', screen === 'stats');
    el.navReview.classList.toggle('active', screen !== 'uni' && screen !== 'stats');
    if (screen === 'stats') {
      el.pageTitle.textContent = '統計';
      el.pageSub.textContent = '利用者の属性と、出品・取引の集計。個人の情報は含みません。';
    } else if (screen === 'uni') {
      el.pageTitle.textContent = '大学の要望';
      el.pageSub.textContent = '要望が多い順。メールドメインを設定すると有効化できます。';
    } else if (screen !== 'secret') {
      el.pageTitle.textContent = '審査キュー';
      el.pageSub.textContent = SUBTITLES[activeTab];
    }
  }

  el.navReview.addEventListener('click', function () { show('list'); renderActiveTab(); });
  el.navUniversities.addEventListener('click', function () { show('uni'); loadUniversities(); });
  el.navStats.addEventListener('click', function () { show('stats'); loadStats(); });

  function callAdmin(action, extra) {
    var body = Object.assign({ action: action }, extra || {});
    return fetch(ADMIN_URL, {
      method: 'POST',
      headers: Object.assign({ 'content-type': 'application/json' }, authHeaders()),
      body: JSON.stringify(body),
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (json) {
        if (!res.ok) {
          var err = new Error((json && json.error) || ('http_' + res.status));
          err.status = res.status;
          err.code = json && json.error;
          throw err;
        }
        return json;
      });
    });
  }

  function yen(n) { return '¥' + Number(n).toLocaleString('ja-JP'); }

  function formatExpires(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    var diffMs = d.getTime() - Date.now();
    var diffH = Math.round(diffMs / 3_600_000);
    var dateText = d.toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    if (diffMs <= 0) return dateText + '(期限切れ)';
    if (diffH < 24) return dateText + '(残り約' + diffH + '時間)';
    return dateText + '(残り約' + Math.round(diffH / 24) + '日)';
  }

  // 取引完了(captured_at)から72時間後が、返金受付の締切。
  function formatRefundWindow(capturedAtIso) {
    if (!capturedAtIso) return { text: '完了日時不明', closed: true };
    var deadline = new Date(capturedAtIso).getTime() + 72 * 3_600_000;
    var diffMs = deadline - Date.now();
    var dateText = new Date(deadline).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    if (diffMs <= 0) return { text: '受付期限切れ(' + dateText + ')', closed: true };
    var diffH = Math.round(diffMs / 3_600_000);
    return { text: '残り約' + diffH + '時間(' + dateText + 'まで)', closed: false };
  }

  var REASON_LABELS = { spam: 'スパム', prohibited_item: '禁止出品物', harassment: '嫌がらせ', fraud: '詐欺・不正', other: 'その他' };
  // キャンセルの理由(アプリの CancelReason と同じ 8 つ)
  var CANCEL_REASON_LABELS = {
    mutual_agreement: '双方が合意した', unreachable: '連絡が取れない', no_schedule: '日時が決まらない',
    lost_or_damaged: '商品の紛失・破損', not_as_described: '説明と著しく異なる', suspected_fake: '偽物・盗品の疑い',
    safety_concern: '安全上の懸念', other: 'その他',
  };
  var CANCELED_BY_LABELS = { buyer: '購入者が申請', seller: '出品者が申請' };
  // 申請の状態。審査待ち(pending)だけが、承認・却下の対象
  var CANCEL_STATUS = {
    pending: { label: '審査待ち', cls: 'pill todo' }, approved: { label: '承認済み', cls: 'pill ok' },
    rejected: { label: '却下', cls: 'pill warn' }, withdrawn: { label: '取り下げ', cls: 'pill' }, void: { label: '無効', cls: 'pill' },
  };
  function cancelStatus(status) { return CANCEL_STATUS[status] || { label: status || '不明', cls: 'pill' }; }
  function pendingCount(list) { return list.filter(function (c) { return c.status === 'pending'; }).length; }
  function formatDateTime(iso) {
    return new Date(iso).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  var SUBTITLES = {
    reviews: '審査中(disputed)の取引 — 完了・取消の判断',
    reports: '取引完了後72時間以内の問題報告 — 返金・却下の判断',
    cancels: 'キャンセルの申請 — 審査待ちを承認・却下する(審査待ちが先頭)',
  };

  function originLabel(deal) {
    if (deal.disputed_by) return '購入者:問題あり';
    if (deal.review_requested_by) return '出品者:審査申請';
    return '審査中';
  }

  // ---- 1. シークレット ----
  function trySecretAndLoadList(secret, type) {
    el.secretError.hidden = true;
    el.secretSubmit.disabled = true;
    el.secretSubmit.textContent = '確認中…';
    setCred(type || 'secret', secret);
    callAdmin('list_reviews')
      .then(function (json) {
        show('list');
        loadBothCounts();
        renderActiveTab();
      })
      .catch(function (err) {
        clearSecret();
        el.secretError.hidden = false;
        el.secretError.textContent = err.code === 'unauthorized'
          ? (type === 'google' ? 'このGoogleアカウントではログインできません。' : 'ADMIN_SECRET が正しくありません。')
          : '接続に失敗しました(' + err.message + ')。もう一度お試しください。';
      })
      .finally(function () {
        el.secretSubmit.disabled = false;
        el.secretSubmit.textContent = '保存して一覧へ';
      });
  }

  el.secretSubmit.addEventListener('click', function () {
    var v = el.secretInput.value.trim();
    if (!v) return;
    trySecretAndLoadList(v);
  });
  el.secretInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') el.secretSubmit.click();
  });
  el.changeSecretBtn.addEventListener('click', function () {
    clearSecret();
    el.secretInput.value = '';
    el.secretError.hidden = true;
    show('secret');
  });

  // ---- 2. 一覧(タブ) ----
  function setTab(tab) {
    activeTab = tab;
    el.tabReviews.classList.toggle('active', tab === 'reviews');
    el.tabReports.classList.toggle('active', tab === 'reports');
    el.tabCancels.classList.toggle('active', tab === 'cancels');
    el.pageSub.textContent = SUBTITLES[tab];
    renderActiveTab();
  }
  var userPickedTab = false;
  function pickTab(tab) { userPickedTab = true; setTab(tab); }
  el.tabReviews.addEventListener('click', function () { pickTab('reviews'); });
  el.tabReports.addEventListener('click', function () { pickTab('reports'); });
  el.tabCancels.addEventListener('click', function () { pickTab('cancels'); });

  function loadBothCounts() {
    callAdmin('list_reviews').then(function (json) { el.countReviews.textContent = (json.deals || []).length; }).catch(function () {});
    callAdmin('list_deal_reports').then(function (json) { el.countReports.textContent = (json.reports || []).length; }).catch(function () {});
    callAdmin('list_cancellations').then(function (json) {
      var pending = pendingCount(json.cancellations || []);
      el.countCancels.textContent = pending;
      // 審査待ちの申請があるのに最初のタブのままだと見落とすので、まだタブを選んでいなければ「キャンセル」を開く
      if (pending > 0 && !userPickedTab && activeTab === 'reviews') setTab('cancels');
    }).catch(function () {});
  }

  function renderActiveTab() {
    el.listLoading.hidden = false;
    el.listError.hidden = true;
    el.listRetry.hidden = true;
    el.listEmpty.hidden = true;
    el.dealList.innerHTML = '';
    var tab = activeTab;
    var action = { reviews: 'list_reviews', reports: 'list_deal_reports', cancels: 'list_cancellations' }[tab];
    callAdmin(action)
      .then(function (json) {
        if (tab !== activeTab) return; // 読み込み中に別のタブへ切り替えた
        if (tab === 'reviews') { renderList(json.deals || []); el.countReviews.textContent = (json.deals || []).length; }
        else if (tab === 'reports') { renderReportList(json.reports || []); el.countReports.textContent = (json.reports || []).length; }
        else { renderCancelList(json.cancellations || []); el.countCancels.textContent = pendingCount(json.cancellations || []); }
      })
      .catch(function (err) {
        if (err.code === 'unauthorized') { clearSecret(); show('secret'); return; }
        el.listError.hidden = false;
        el.listError.textContent = '読み込みに失敗しました(' + err.message + ')。';
        el.listRetry.hidden = false;
      })
      .finally(function () { el.listLoading.hidden = true; });
  }

  function renderList(deals) {
    el.dealList.innerHTML = '';
    el.listEmpty.hidden = deals.length !== 0;
    el.listEmpty.textContent = '審査中の取引はありません。';
    deals.forEach(function (deal) {
      var row = document.createElement('button');
      row.className = 'deal-row';
      row.innerHTML =
        '<span class="price">' + yen(deal.price_jpy) + '</span>' +
        '<span class="meta"><span class="origin">' + originLabel(deal) + '</span></span>' +
        '<span class="expires">' + formatExpires(deal.expires_at) + '</span>';
      row.addEventListener('click', function () { openDetail(deal.id); });
      el.dealList.appendChild(row);
    });
  }

  function renderReportList(reports) {
    el.dealList.innerHTML = '';
    el.listEmpty.hidden = reports.length !== 0;
    el.listEmpty.textContent = '未対応の問題報告はありません。';
    reports.forEach(function (report) {
      var deal = report.deal;
      var row = document.createElement('button');
      row.className = 'deal-row';
      var priceText = deal ? yen(deal.price_jpy) : '—';
      var win = deal ? formatRefundWindow(deal.captured_at) : { text: '取引不明', closed: true };
      var alreadyRefunded = deal && deal.refunded_at;
      var pillHtml = alreadyRefunded
        ? '<span class="pill">返金済み</span>'
        : '<span class="pill' + (win.closed ? ' warn' : '') + '">' + win.text + '</span>';
      row.innerHTML =
        '<span class="price">' + priceText + '</span>' +
        '<span class="meta"><span class="origin">' + (REASON_LABELS[report.reason] || 'その他') + '</span></span>' +
        '<span class="expires">' + pillHtml + '</span>';
      row.addEventListener('click', function () { openReportDetail(report.id); });
      el.dealList.appendChild(row);
    });
  }

  // 詳細・タイトルは利用者が書いた文章なので、innerHTML は使わず textContent で入れる(XSS 対策)。
  function textSpan(className, text) {
    var span = document.createElement('span');
    span.className = className;
    span.textContent = text;
    return span;
  }

  function renderCancelList(cancellations) {
    el.dealList.innerHTML = '';
    el.listEmpty.hidden = cancellations.length !== 0;
    el.listEmpty.textContent = 'キャンセルの申請はまだありません。';
    cancellations.forEach(function (c) {
      var row = document.createElement('button');
      var st = cancelStatus(c.status);
      row.className = 'deal-row' + (c.status === 'pending' ? '' : ' done');
      var meta = document.createElement('span');
      meta.className = 'meta';
      meta.appendChild(textSpan(st.cls, st.label));
      meta.appendChild(document.createTextNode(' '));
      meta.appendChild(textSpan('origin', (CANCEL_REASON_LABELS[c.reason] || c.reason) + ' · ' + (CANCELED_BY_LABELS[c.canceled_by] || '退会済みの利用者')));
      meta.appendChild(document.createElement('br'));
      meta.appendChild(textSpan('sub', c.listing_title || '(出品タイトル不明)'));
      row.appendChild(textSpan('price', c.price_jpy == null ? '—' : yen(c.price_jpy)));
      row.appendChild(meta);
      row.appendChild(textSpan('expires', formatDateTime(c.created_at)));
      row.addEventListener('click', function () { openCancelDetail(c.id); });
      el.dealList.appendChild(row);
    });
  }

  var currentCancelRequestId = null;

  function openCancelDetail(requestId) {
    currentCancelRequestId = requestId;
    el.cancelDecision.hidden = true;
    el.cancelActionError.hidden = true;
    el.cancelNoteInput.value = '';
    show('cancel-detail');
    el.cancelDetailLoading.hidden = false;
    el.cancelDetailError.hidden = true;
    el.cancelDetailBody.hidden = true;
    callAdmin('cancellation_detail', { request_id: requestId })
      .then(function (json) {
        var c = json.cancellation;
        if (!c) {
          el.cancelDetailError.hidden = false;
          el.cancelDetailError.textContent = 'この申請は見つかりませんでした。一覧に戻って更新してください。';
          return;
        }
        el.cancelDetailTitle.textContent = c.listing_title || '(出品タイトル不明)';
        el.cancelDetailPrice.textContent = c.price_jpy == null ? '' : yen(c.price_jpy);
        var st = cancelStatus(c.status);
        el.cancelDetailBy.textContent = st.label + ' · ' + (CANCELED_BY_LABELS[c.canceled_by] || '退会済みの利用者');
        el.cancelDetailBy.className = st.cls;
        el.cancelDetailBuyer.textContent = c.buyer_display_name || '(表示名未設定)';
        el.cancelDetailSeller.textContent = c.seller_display_name || '(表示名未設定)';
        el.cancelReason.textContent = '理由: ' + (CANCEL_REASON_LABELS[c.reason] || c.reason);
        el.cancelDetailText.textContent = c.detail;
        el.cancelCreatedAt.textContent = '申請日時: ' + new Date(c.created_at).toLocaleString('ja-JP');
        el.cancelDecidedAt.textContent = c.status !== 'pending' && c.decided_at
          ? st.label + 'になった日時: ' + new Date(c.decided_at).toLocaleString('ja-JP') : '';
        el.cancelDecision.hidden = c.status !== 'pending';
        var count = c.author_recent_cancel_count;
        el.cancelHistory.textContent = count == null ? '' : 'この人の直近30日の承認後キャンセル: ' + count + '回';
        el.cancelHistory.style.color = count != null && count >= 2 ? 'var(--danger)' : '';
        renderMessageList(el.cancelMessages, json.messages || [], c.buyer_id);
        el.cancelDetailBody.hidden = false;
      })
      .catch(function (err) {
        if (err.code === 'unauthorized') { clearSecret(); show('secret'); return; }
        el.cancelDetailError.hidden = false;
        el.cancelDetailError.textContent = '読み込みに失敗しました(' + err.message + ')。';
      })
      .finally(function () { el.cancelDetailLoading.hidden = true; });
  }

  function submitCancelDecision(action, btn) {
    var note = el.cancelNoteInput.value.trim();
    if (!note) { el.cancelNoteInput.focus(); return; }
    el.cancelActionError.hidden = true;
    el.approveCancelBtn.disabled = true;
    el.rejectCancelBtn.disabled = true;
    var originalText = btn.textContent;
    btn.innerHTML = '<span class="spinner"></span> 送信中…';
    callAdmin(action, { request_id: currentCancelRequestId, note: note })
      .then(function () { show('list'); renderActiveTab(); })
      .catch(function (err) {
        if (err.code === 'unauthorized') { clearSecret(); show('secret'); return; }
        el.cancelActionError.hidden = false;
        el.cancelActionError.textContent = '失敗しました(' + err.message + ')。' +
          (err.code === 'deal_invalid_state' ? ' 申請がすでに判断済み・取り下げ済みか、取引が受け渡し待ちではなくなっています。一覧に戻って更新してください。' : '');
      })
      .finally(function () {
        el.approveCancelBtn.disabled = false;
        el.rejectCancelBtn.disabled = false;
        btn.textContent = originalText;
      });
  }
  el.approveCancelBtn.addEventListener('click', function () { submitCancelDecision('approve_cancellation', el.approveCancelBtn); });
  el.rejectCancelBtn.addEventListener('click', function () { submitCancelDecision('reject_cancellation', el.rejectCancelBtn); });

  el.backToListFromCancel.addEventListener('click', function () { show('list'); renderActiveTab(); });

  el.listRetry.addEventListener('click', renderActiveTab);
  el.listRefresh.addEventListener('click', renderActiveTab);
  el.backToList.addEventListener('click', function () { show('list'); renderActiveTab(); });
  el.backToListFromReport.addEventListener('click', function () { show('list'); renderActiveTab(); });

  // ---- 3a. 審査中の取引の詳細 ----
  var currentDealId = null;

  function openDetail(dealId) {
    currentDealId = dealId;
    show('detail');
    el.detailLoading.hidden = false;
    el.detailError.hidden = true;
    el.detailBody.hidden = true;
    el.actionError.hidden = true;
    el.noteInput.value = '';
    callAdmin('review_detail', { deal_id: dealId })
      .then(function (json) {
        if (!json.deal) {
          el.detailError.hidden = false;
          el.detailError.textContent = 'この取引は既に処理済みです。一覧に戻って更新してください。';
          return;
        }
        renderDetail(json.deal, json.messages || []);
        el.detailBody.hidden = false;
      })
      .catch(function (err) {
        if (err.code === 'unauthorized') { clearSecret(); show('secret'); return; }
        el.detailError.hidden = false;
        el.detailError.textContent = '読み込みに失敗しました(' + err.message + ')。';
      })
      .finally(function () { el.detailLoading.hidden = true; });
  }

  function renderMessageList(container, messages, buyerId) {
    container.innerHTML = '';
    if (messages.length === 0) {
      container.innerHTML = '<div class="sub">メッセージはありません。</div>';
      return;
    }
    messages.forEach(function (m) {
      var who = m.sender_id === buyerId ? 'buyer' : 'seller';
      var div = document.createElement('div');
      div.className = 'msg ' + who;
      var body = document.createElement('div');
      body.textContent = m.body;
      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = (who === 'buyer' ? '購入者' : '出品者') + ' · ' +
        new Date(m.created_at).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      div.appendChild(body);
      div.appendChild(meta);
      container.appendChild(div);
    });
    container.scrollTop = container.scrollHeight;
  }

  function renderDetail(deal, messages) {
    el.detailTitle.textContent = deal.listing_title || '(出品タイトル不明)';
    el.detailPrice.textContent = yen(deal.price_jpy) + ' / 期限 ' + formatExpires(deal.expires_at);
    el.detailOrigin.textContent = originLabel(deal);
    el.detailBuyer.textContent = deal.buyer_display_name || '(表示名未設定)';
    el.detailSeller.textContent = deal.seller_display_name || '(表示名未設定)';
    renderMessageList(el.detailMessages, messages, deal.buyer_id);
  }

  function submitDecision(action) {
    var note = el.noteInput.value.trim();
    if (!note) { el.noteInput.focus(); return; }
    el.actionError.hidden = true;
    el.completeBtn.disabled = true;
    el.cancelBtn.disabled = true;
    var btn = action === 'complete' ? el.completeBtn : el.cancelBtn;
    var originalText = btn.textContent;
    btn.innerHTML = '<span class="spinner"></span> 送信中…';
    callAdmin(action, { deal_id: currentDealId, note: note })
      .then(function () { show('list'); renderActiveTab(); })
      .catch(function (err) {
        if (err.code === 'unauthorized') { clearSecret(); show('secret'); return; }
        el.actionError.hidden = false;
        el.actionError.textContent = '失敗しました(' + err.message + ')。' +
          (err.code === 'deal_invalid_state' ? ' 少し待ってからもう一度お試しください。' : '');
      })
      .finally(function () {
        el.completeBtn.disabled = false;
        el.cancelBtn.disabled = false;
        btn.textContent = originalText;
      });
  }

  el.completeBtn.addEventListener('click', function () { submitDecision('complete'); });
  el.cancelBtn.addEventListener('click', function () { submitDecision('cancel'); });

  // ---- 3b. 事後問題報告の詳細 ----
  var currentReportId = null;
  var currentReportDealId = null;

  function openReportDetail(reportId) {
    currentReportId = reportId;
    currentReportDealId = null;
    show('report-detail');
    el.reportDetailLoading.hidden = false;
    el.reportDetailError.hidden = true;
    el.reportDetailBody.hidden = true;
    el.reportActionError.hidden = true;
    el.reportNoteInput.value = '';
    callAdmin('deal_report_detail', { report_id: reportId })
      .then(function (json) {
        if (!json.report) {
          el.reportDetailError.hidden = false;
          el.reportDetailError.textContent = 'この報告は見つかりませんでした。一覧に戻って更新してください。';
          return;
        }
        renderReportDetail(json.report, json.messages || []);
        el.reportDetailBody.hidden = false;
      })
      .catch(function (err) {
        if (err.code === 'unauthorized') { clearSecret(); show('secret'); return; }
        el.reportDetailError.hidden = false;
        el.reportDetailError.textContent = '読み込みに失敗しました(' + err.message + ')。';
      })
      .finally(function () { el.reportDetailLoading.hidden = true; });
  }

  function renderReportDetail(report, messages) {
    var deal = report.deal;
    el.reportReason.textContent = '理由: ' + (REASON_LABELS[report.reason] || report.reason);
    el.reportDetail.textContent = report.detail || '(詳細の記載なし)';
    el.reportCreatedAt.textContent = '報告日時: ' + new Date(report.created_at).toLocaleString('ja-JP');

    if (!deal) {
      el.reportDetailTitle.textContent = '(対象の取引が見つかりません)';
      el.reportDetailPrice.textContent = '';
      el.reportDetailWindow.textContent = '';
      el.reportDetailBuyer.textContent = '—';
      el.reportDetailSeller.textContent = '—';
      renderMessageList(el.reportMessages, [], null);
      el.refundBtn.disabled = true;
      el.dismissBtn.disabled = false;
      return;
    }
    currentReportDealId = deal.id;
    el.reportDetailTitle.textContent = deal.listing_title || '(出品タイトル不明)';
    el.reportDetailPrice.textContent = yen(deal.price_jpy) + '(手数料 ' + yen(deal.fee_jpy) + ' を除くと ' + yen(deal.price_jpy - deal.fee_jpy) + ')';
    el.reportDetailBuyer.textContent = deal.buyer_display_name || '(表示名未設定)';
    el.reportDetailSeller.textContent = deal.seller_display_name || '(表示名未設定)';
    renderMessageList(el.reportMessages, messages, deal.buyer_id);

    if (deal.refunded_at) {
      el.reportDetailWindow.textContent = '返金済み(' + yen(deal.refund_amount_jpy) + ')';
      el.reportDetailWindow.className = 'pill';
      el.refundBtn.disabled = true;
    } else if (deal.status !== 'completed') {
      el.reportDetailWindow.textContent = '取引ステータス: ' + deal.status + '(返金対象外)';
      el.reportDetailWindow.className = 'pill warn';
      el.refundBtn.disabled = true;
    } else {
      var win = formatRefundWindow(deal.captured_at);
      el.reportDetailWindow.textContent = win.text;
      el.reportDetailWindow.className = 'pill' + (win.closed ? ' warn' : '');
      el.refundBtn.disabled = win.closed;
    }
  }

  function submitRefund() {
    var note = el.reportNoteInput.value.trim();
    if (!note) { el.reportNoteInput.focus(); return; }
    if (!currentReportDealId) return;
    el.reportActionError.hidden = true;
    el.refundBtn.disabled = true;
    el.dismissBtn.disabled = true;
    var originalText = el.refundBtn.textContent;
    el.refundBtn.innerHTML = '<span class="spinner"></span> 返金中…';
    callAdmin('refund', { deal_id: currentReportDealId, note: note, report_id: currentReportId })
      .then(function () { show('list'); renderActiveTab(); })
      .catch(function (err) {
        if (err.code === 'unauthorized') { clearSecret(); show('secret'); return; }
        el.reportActionError.hidden = false;
        el.reportActionError.textContent = '失敗しました(' + err.message + ')。' +
          (err.code === 'deal_invalid_state' || err.code === 'refund_window_closed' ? ' 条件を満たしていないか、既に処理済みの可能性があります。' : '');
      })
      .finally(function () {
        el.refundBtn.disabled = false;
        el.dismissBtn.disabled = false;
        el.refundBtn.textContent = originalText;
      });
  }

  function submitDismiss() {
    el.reportActionError.hidden = true;
    el.refundBtn.disabled = true;
    el.dismissBtn.disabled = true;
    var originalText = el.dismissBtn.textContent;
    el.dismissBtn.innerHTML = '<span class="spinner"></span> 送信中…';
    callAdmin('dismiss_deal_report', { report_id: currentReportId })
      .then(function () { show('list'); renderActiveTab(); })
      .catch(function (err) {
        if (err.code === 'unauthorized') { clearSecret(); show('secret'); return; }
        el.reportActionError.hidden = false;
        el.reportActionError.textContent = '失敗しました(' + err.message + ')。';
      })
      .finally(function () {
        el.refundBtn.disabled = false;
        el.dismissBtn.disabled = false;
        el.dismissBtn.textContent = originalText;
      });
  }

  el.refundBtn.addEventListener('click', submitRefund);
  el.dismissBtn.addEventListener('click', submitDismiss);

  function handleGoogleCredential(response) {
    trySecretAndLoadList(response.credential, 'google');
  }
  if (window.google && google.accounts && google.accounts.id) {
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential });
    google.accounts.id.renderButton(document.getElementById('googleButton'), { theme: 'outline', size: 'large', width: 300 });
  } else {
    // gsi/client はまだ async ロード中のことがある。読み込み完了を少し待って再試行する。
    window.addEventListener('load', function () {
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential });
        google.accounts.id.renderButton(document.getElementById('googleButton'), { theme: 'outline', size: 'large', width: 300 });
      }
    });
  }

  // ---- 5. 統計 ----
  // 見出し・並び・ラベルは DB(admin_user_stats)が決める。ここは返ってきた表をそのまま描くだけ。
  var SMALL_CELL = 5; // これ未満の区分は、個人が推測されうる
  var lastStats = null;

  function divWith(className, text) {
    var node = document.createElement('div');
    node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function loadStats() {
    el.statsLoading.hidden = false;
    el.statsError.hidden = true;
    el.statsNote.hidden = true;
    el.statsBody.innerHTML = '';
    callAdmin('user_stats')
      .then(function (json) { lastStats = json; renderStats(json); })
      .catch(function (err) {
        if (err.code === 'unauthorized') { clearCred(); show('secret'); return; }
        el.statsError.hidden = false;
        el.statsError.textContent = '読み込みに失敗しました(' + err.message + ')。';
      })
      .finally(function () { el.statsLoading.hidden = true; });
  }

  function renderStats(json) {
    el.statsBody.innerHTML = '';
    el.statsNote.hidden = false;
    el.statsNote.textContent = '集計: ' + new Date(json.generated_at).toLocaleString('ja-JP')
      + '。審査用アカウントと、プロフィール未設定の利用者は含みません。'
      + SMALL_CELL + '人未満の区分は、社外に出す資料では伏せてください(個人が推測されるため)。';
    var tiles = divWith('stat-tiles');
    (json.summary || []).forEach(function (item) {
      var tile = divWith('stat-tile');
      tile.appendChild(divWith('label', item.label));
      tile.appendChild(divWith('value', Number(item.value).toLocaleString('ja-JP')));
      tiles.appendChild(tile);
    });
    el.statsBody.appendChild(tiles);
    (json.sections || []).forEach(function (section) {
      var rows = section.rows || [];
      var total = rows.reduce(function (sum, row) { return sum + row.count; }, 0);
      var max = rows.reduce(function (m, row) { return Math.max(m, row.count); }, 0);
      var box = divWith('stat-section');
      var title = document.createElement('h3');
      title.textContent = section.title;
      box.appendChild(title);
      if (rows.length === 0) box.appendChild(divWith('stat-note', 'まだデータがありません。'));
      rows.forEach(function (row) {
        var line = divWith('stat-row');
        line.appendChild(divWith('label', row.label));
        var bar = divWith('bar');
        var fill = document.createElement('span');
        fill.style.width = (max ? Math.round(row.count / max * 100) : 0) + '%';
        bar.appendChild(fill);
        line.appendChild(bar);
        var num = divWith('num', row.count.toLocaleString('ja-JP'));
        var share = document.createElement('small');
        share.textContent = (total ? Math.round(row.count / total * 1000) / 10 : 0) + '%';
        num.appendChild(share);
        line.appendChild(num);
        box.appendChild(line);
      });
      el.statsBody.appendChild(box);
    });
  }

  /** スプレッドシートに貼れる形(タブ区切り)。 */
  function statsAsTsv(json) {
    var lines = [['項目', '値'].join('\t')];
    (json.summary || []).forEach(function (item) { lines.push([item.label, item.value].join('\t')); });
    (json.sections || []).forEach(function (section) {
      lines.push('');
      lines.push([section.title, '人数・件数'].join('\t'));
      (section.rows || []).forEach(function (row) { lines.push([row.label, row.count].join('\t')); });
    });
    return lines.join('\n');
  }

  el.statsRefresh.addEventListener('click', loadStats);
  el.statsCopy.addEventListener('click', function () {
    if (!lastStats) return;
    navigator.clipboard.writeText(statsAsTsv(lastStats))
      .then(function () { el.statsCopy.textContent = 'コピーしました'; })
      .catch(function () { el.statsCopy.textContent = 'コピーできませんでした'; })
      .finally(function () { setTimeout(function () { el.statsCopy.textContent = '表をコピー（TSV）'; }, 1600); });
  });

  // ---- 4. 大学の要望 ----
  var openUniRowId = null; // 一度に1件だけ編集パネルを開く

  function loadUniversities() {
    el.uniLoading.hidden = false;
    el.uniError.hidden = true;
    el.uniRetry.hidden = true;
    el.uniEmpty.hidden = true;
    el.uniList.innerHTML = '';
    callAdmin('list_university_wishes')
      .then(function (json) { renderUniversities(json.universities || []); })
      .catch(function (err) {
        if (err.code === 'unauthorized') { clearCred(); show('secret'); return; }
        el.uniError.hidden = false;
        el.uniError.textContent = '読み込みに失敗しました(' + err.message + ')。';
        el.uniRetry.hidden = false;
      })
      .finally(function () { el.uniLoading.hidden = true; });
  }

  function renderUniversities(universities) {
    el.uniList.innerHTML = '';
    el.uniEmpty.hidden = universities.length !== 0;
    universities.forEach(function (uni) { el.uniList.appendChild(uniRow(uni)); });
  }

  function spanWith(className, text) {
    var el = document.createElement('span');
    el.className = className;
    el.textContent = text;
    return el;
  }

  function uniRow(uni) {
    var row = document.createElement('div');
    row.className = 'uni-row';

    var head = document.createElement('div');
    head.className = 'uni-row-head';
    head.appendChild(spanWith('name', uni.name));
    head.appendChild(spanWith('meta', uni.type + '・' + uni.prefecture));
    head.appendChild(spanWith('pill', uni.is_enabled ? '対応済み' : '未対応'));
    head.appendChild(spanWith('wish', uni.wish_count + '人'));
    head.addEventListener('click', function () { toggleEdit(row, uni); });
    row.appendChild(head);
    return row;
  }

  function toggleEdit(row, uni) {
    var existing = row.querySelector('.uni-edit');
    if (existing) { existing.remove(); openUniRowId = null; return; }
    // 他に開いているパネルがあれば閉じる
    document.querySelectorAll('.uni-edit').forEach(function (p) { p.remove(); });

    openUniRowId = uni.id;
    var panel = document.createElement('div');
    panel.className = 'uni-edit';
    // ラベル等の固定文言だけを innerHTML で組み、ユーザー由来になりうる値(ドメイン一覧)は
    // 後から .value に代入する(属性文字列への直接埋め込みを避ける)。
    panel.innerHTML =
      '<label class="field">メールドメイン(カンマ区切り、例: waseda.jp, kyoto-u.ac.jp)</label>' +
      '<input type="text" />' +
      '<label class="checkbox"><input type="checkbox" /> 有効にする(ドメイン必須)</label>' +
      '<div class="error-banner" hidden></div>' +
      '<div class="btn-row"><button class="primary">保存</button></div>';

    var domainsInput = panel.querySelector('input[type="text"]');
    var enabledInput = panel.querySelector('input[type="checkbox"]');
    var errorBanner = panel.querySelector('.error-banner');
    var saveBtn = panel.querySelector('button.primary');
    domainsInput.value = (uni.email_domains || []).join(', ');
    enabledInput.checked = !!uni.is_enabled;

    saveBtn.addEventListener('click', function () {
      var domains = domainsInput.value.split(',').map(function (d) { return d.trim(); }).filter(Boolean);
      errorBanner.hidden = true;
      saveBtn.disabled = true;
      var originalText = saveBtn.textContent;
      saveBtn.innerHTML = '<span class="spinner"></span> 保存中…';
      callAdmin('set_university_domains', { university_id: uni.id, email_domains: domains, is_enabled: enabledInput.checked })
        .then(function () { loadUniversities(); })
        .catch(function (err) {
          if (err.code === 'unauthorized') { clearCred(); show('secret'); return; }
          errorBanner.hidden = false;
          errorBanner.textContent = err.code === 'enabled_requires_domains'
            ? 'ドメインを設定してからでないと有効化できません。'
            : '保存に失敗しました(' + err.message + ')。';
          saveBtn.disabled = false;
          saveBtn.textContent = originalText;
        });
    });

    panel.appendChild(wishEmailsSection(uni));
    row.appendChild(panel);
  }

  // その大学に「対応したら知らせてほしい」とメールアドレスを残した人。対応した時に、ここからコピーしてメールを送る。
  // アドレスは利用者が入力した値なので、textContent でだけ表示する(HTML として解釈させない)。
  function wishEmailsSection(uni) {
    var section = document.createElement('div');
    section.className = 'wish-emails';
    var label = document.createElement('label');
    label.className = 'field';
    label.textContent = '対応したら知らせてほしい人のメールアドレス';
    var status = spanWith('sub', '読み込み中…');
    var list = document.createElement('ul');
    var copyBtn = document.createElement('button');
    copyBtn.className = 'ghost';
    copyBtn.textContent = 'すべてコピー';
    copyBtn.hidden = true;
    section.appendChild(label);
    section.appendChild(status);
    section.appendChild(list);
    section.appendChild(copyBtn);

    callAdmin('list_wish_emails', { university_id: uni.id })
      .then(function (json) {
        var emails = (json.emails || []).map(function (e) { return e.email; });
        status.textContent = emails.length === 0 ? 'まだありません。' : emails.length + '件';
        emails.forEach(function (email) {
          var item = document.createElement('li');
          item.textContent = email;
          list.appendChild(item);
        });
        copyBtn.hidden = emails.length === 0;
        copyBtn.addEventListener('click', function () {
          navigator.clipboard.writeText(emails.join('\n'))
            .then(function () { copyBtn.textContent = 'コピーしました'; })
            .catch(function () { copyBtn.textContent = 'コピーできませんでした'; });
        });
      })
      .catch(function (err) {
        if (err.code === 'unauthorized') { clearCred(); show('secret'); return; }
        status.textContent = '読み込みに失敗しました(' + err.message + ')。';
      });
    return section;
  }

  el.uniRetry.addEventListener('click', loadUniversities);
  el.uniRefresh.addEventListener('click', loadUniversities);

  // ---- 起動 ----
  var saved = getCred();
  if (saved) { trySecretAndLoadList(saved.value, saved.type); } else { show('secret'); el.secretInput.focus(); }
})();
</script>
